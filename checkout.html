<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checkout | Amyy's Store</title><link rel="stylesheet" href="css/style.css"></head><body>
<header class="site-header"><a class="brand" href="index.html">Amyy<span>Store.</span></a><button class="menu-toggle" aria-label="Toggle navigation">☰</button><nav class="nav"><a href="index.html">Home</a><a href="products.html">Products</a><a href="cart.html">Cart <span class="cart-count">0</span></a><a href="login.html">Login</a><a class="nav-cta" href="register.html">Register</a></nav></header>
<main class="page-wrap narrow"><div class="page-title"><p class="eyebrow">ALMOST THERE</p><h1>Checkout</h1><p>Enter your details for this demo order.</p></div><form class="form-card" id="checkout-form"><div class="form-grid"><div class="form-group"><label for="full-name">Full name</label><input id="full-name" required minlength="3" placeholder="Your full name"></div><div class="form-group"><label for="email">Email address</label><input id="email" type="email" required placeholder="you@example.com"></div><div class="form-group full"><label for="address">Delivery address</label><input id="address" required minlength="8" placeholder="House, street, area"></div><div class="form-group"><label for="city">City</label><input id="city" required placeholder="City"></div><div class="form-group"><label for="phone">Phone number</label><input id="phone" type="tel" pattern="[0-9+ -]{10,15}" required placeholder="03xx xxxxxxx"></div></div><div class="checkout-total"><span>Order total</span><strong id="checkout-total">Rs. 0</strong></div><button class="btn full-btn" type="submit">Place demo order</button><p class="muted">This is a classroom demo. Do not enter real payment information.</p><p id="checkout-message" class="success-message" role="status"></p></form></main><footer class="footer"><a class="brand" href="index.html">Amyy<span>Store.</span></a><small>© 2026 Amyy Store</small></footer><script src="js/app.js"></script></body></html>
